name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        run: python${{ matrix.python-version }} --version

      - name: Install dependencies
        run: python${{ matrix.python-version }} -m pip install -U pip && python${{ matrix.python-version }} -m pip install -e ".[dev]"

      - name: Ruff
        run: python${{ matrix.python-version }} -m ruff check src/hudu_magic tests/unit

      - name: Unit tests
        run: python${{ matrix.python-version }} -m pytest tests/unit -v --tb=short
